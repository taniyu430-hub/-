<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健太君くじ ダブルアップチャンス</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background:
    radial-gradient(circle at top left, #fff4c7 0, transparent 35%),
    radial-gradient(circle at bottom right, #dff4ff 0, transparent 40%),
    linear-gradient(180deg,#fffdf7,#f8fbff);
  color:#4b443f;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:24px 14px;
}

.card{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.96);
  border:1px solid #eee5dc;
  border-radius:28px;
  padding:28px 20px 30px;
  box-shadow:0 12px 35px rgba(83,70,56,.12);
  position:relative;
  overflow:hidden;
}

.decoration{
  position:absolute;
  font-size:34px;
  opacity:.75;
}

.d1{
  top:14px;
  left:14px;
}

.d2{
  top:16px;
  right:14px;
}

.d3{
  bottom:12px;
  left:16px;
}

.d4{
  bottom:12px;
  right:16px;
}

.logo{
  display:inline-block;
  background:#fff0f3;
  color:#d9687c;
  border-radius:999px;
  padding:7px 16px;
  font-size:14px;
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:12px;
}

h1{
  margin:0;
  font-size:30px;
  color:#38322e;
  line-height:1.25;
}

.subtitle{
  margin-top:8px;
  color:#776b62;
  font-size:16px;
}

.slot-frame{
  margin:26px auto 0;
  background:#f7efe6;
  border:3px solid #e4cda9;
  border-radius:22px;
  padding:16px 12px;
  display:flex;
  justify-content:center;
  gap:8px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9);
}

.reel{
  width:88px;
  height:105px;
  background:#fff;
  border:2px solid #eee3d8;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:46px;
  box-shadow:0 5px 12px rgba(103,85,65,.08);
}

.start-button{
  width:100%;
  margin-top:24px;
  border:none;
  border-radius:16px;
  padding:17px;
  background:#ff9faf;
  color:#fff;
  font-size:21px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 5px 0 #de788a;
}

.start-button:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #de788a;
}

.start-button:disabled{
  cursor:default;
  opacity:.9;
}

#result{
  min-height:88px;
  margin-top:24px;
  font-size:27px;
  font-weight:900;
  color:#7b716a;
  line-height:1.45;
}

.result-small{
  display:block;
  margin-top:8px;
  font-size:16px;
  font-weight:600;
  color:#635b55;
}

.birthday-message{
  margin-top:22px;
  font-size:14px;
  color:#8a817a;
}

.shake{
  animation:shake .1s infinite;
}

.pop{
  animation:pop .55s ease;
}

@keyframes shake{
  0%{transform:translateX(-2px)}
  50%{transform:translateX(2px)}
  100%{transform:translateX(-2px)}
}

@keyframes pop{
  0%{transform:scale(.85);opacity:0}
  70%{transform:scale(1.07)}
  100%{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<div class="card">

  <div class="decoration d1">🎈</div>
  <div class="decoration d2">🎂</div>
  <div class="decoration d3">🌟</div>
  <div class="decoration d4">🎁</div>

  <div class="logo">KENTA BIRTHDAY LOTTERY</div>

  <h1>健太君くじ</h1>

  <div class="subtitle">
    ダブルアップチャンス
  </div>

  <div class="slot-frame" id="slotFrame">
    <div class="reel" id="r1">？</div>
    <div class="reel" id="r2">？</div>
    <div class="reel" id="r3">？</div>
  </div>

  <button
    class="start-button"
    id="startButton"
    onclick="startSlot()"
  >
    スロットを回す
  </button>

  <div id="result"></div>

  <div class="birthday-message">
    健太君、お誕生日おめでとう🎉
  </div>

</div>

<script>
let running = false;

function startSlot(){

  if(running) return;
  running = true;

  const icons = ["🍰","🎈","⭐","☕","👑","💰"];

  const reels = [
    document.getElementById("r1"),
    document.getElementById("r2"),
    document.getElementById("r3")
  ];

  const button = document.getElementById("startButton");
  const result = document.getElementById("result");
  const slotFrame = document.getElementById("slotFrame");

  button.disabled = true;
  button.textContent = "抽選中…";
  result.innerHTML = "";

  slotFrame.classList.add("shake");

  const timers = reels.map((reel) => {
    return setInterval(() => {
      reel.textContent =
        icons[Math.floor(Math.random() * icons.length)];
    }, 90);
  });

  setTimeout(() => {
    clearInterval(timers[0]);
    reels[0].textContent = "💰";
  }, 1600);

  setTimeout(() => {
    clearInterval(timers[1]);
    reels[1].textContent = "💰";
  }, 2200);

  setTimeout(() => {
    clearInterval(timers[2]);
    reels[2].textContent = "👑";

    slotFrame.classList.remove("shake");

    result.classList.add("pop");

    result.innerHTML =
      "ざんねーん！<span class='result-small'>今回はハズレでした👅</span>";

    button.textContent = "また挑戦してね❕";

    if(navigator.vibrate){
      navigator.vibrate([120,80,120]);
    }

  }, 2900);
}
</script>

</body>
</html>
