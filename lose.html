<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>健太君くじ｜ダブルアップチャンス</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Mochiy+Pop+One&display=swap"
  rel="stylesheet"
>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px 14px;
  overflow-x:hidden;

  font-family:"M PLUS Rounded 1c",sans-serif;
  color:#66555c;

  background:
    radial-gradient(circle at 10% 12%, #ffe9f1 0 8%, transparent 9%),
    radial-gradient(circle at 92% 20%, #e7f6ff 0 9%, transparent 10%),
    radial-gradient(circle at 14% 88%, #fff1bf 0 8%, transparent 9%),
    linear-gradient(145deg,#fffdfd,#fff5f8 48%,#f2faff);
}

.background-decoration{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.background-decoration span{
  position:absolute;
  opacity:.35;
  animation:float 5s ease-in-out infinite;
}

.background-decoration span:nth-child(1){
  top:7%;
  left:7%;
  font-size:25px;
}

.background-decoration span:nth-child(2){
  top:13%;
  right:8%;
  font-size:28px;
  animation-delay:.8s;
}

.background-decoration span:nth-child(3){
  bottom:10%;
  left:8%;
  font-size:25px;
  animation-delay:1.4s;
}

.background-decoration span:nth-child(4){
  bottom:8%;
  right:7%;
  font-size:28px;
  animation-delay:2s;
}

  .background-decoration span:nth-child(5){
  top:38%;
  left:4%;
  font-size:24px;
  animation-delay:2.4s;
}

.background-decoration span:nth-child(6){
  top:52%;
  right:5%;
  font-size:24px;
  animation-delay:2.8s;
}

.background-decoration span:nth-child(7){
  bottom:25%;
  left:12%;
  font-size:23px;
  animation-delay:3.2s;
}

.background-decoration span:nth-child(8){
  top:30%;
  right:13%;
  font-size:22px;
  animation-delay:3.6s;
}
  
.card{
  position:relative;
  z-index:2;

  width:100%;
  max-width:420px;
  padding:28px 20px 26px;

  text-align:center;
  background:rgba(255,255,255,.95);
  border:3px solid #ffd5e2;
  border-radius:32px;

  box-shadow:
    0 14px 35px rgba(214,142,165,.18),
    inset 0 0 0 6px #fff8fa;
}

.top-label{
  display:inline-block;
  padding:7px 15px;
  margin-bottom:11px;

  border-radius:999px;
  background:#e8f7ff;
  color:#68a7c5;

  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
}

.happy-birthday{
  margin-bottom:5px;

  color:#df839e;
  font-family:"Mochiy Pop One",sans-serif;
  font-size:15px;
  letter-spacing:.04em;
}

h1{
  margin:0;

  font-family:"Mochiy Pop One",sans-serif;
  font-size:34px;
  color:#ef789a;

  text-shadow:
    2px 2px 0 #fff,
    4px 4px 0 #ffe3eb;
}

.subtitle{
  display:inline-block;
  margin-top:12px;
  padding:7px 16px;

  border-radius:999px;
  background:#fff1c9;
  color:#b58a38;

  font-size:15px;
  font-weight:800;
}

.message{
  margin-top:14px;
  font-size:13px;
  color:#9a858c;
}

.slot-machine{
  position:relative;

  margin-top:23px;
  padding:15px 11px 18px;

  border:3px solid #f2b7c9;
  border-radius:25px;
  background:linear-gradient(180deg,#fff0f5,#ffe5ed);

  box-shadow:
    0 7px 0 #e89eb5,
    inset 0 2px 0 #fff;
}

  .slot-header{

  margin-bottom:14px;

  font-family:"Mochiy Pop One",sans-serif;
  font-size:18px;
  letter-spacing:.08em;

  color:#fff;

  text-shadow:
    0 0 8px #ff6ea8,
    0 0 18px #ffb7d1;

    animation:headerGlow 2s ease-in-out infinite;
}

  @keyframes headerGlow{

  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.75;
    transform:scale(1.05);
  }

}
  
.slot-light{
  display:flex;
  justify-content:center;
  gap:9px;
  margin-bottom:11px;
}

.slot-light span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff8a9;
  box-shadow:0 0 8px #ffd45c;
}

  .slot-machine.shake .slot-light span{
  animation:lightBlink .35s infinite alternate;
}

.slot-machine.shake .slot-light span:nth-child(even){
  animation-delay:.18s;
}

@keyframes lightBlink{
  from{
    opacity:.35;
    transform:scale(.75);
  }
  to{
    opacity:1;
    transform:scale(1.25);
  }
}
  
.reels{
  display:flex;
  justify-content:center;
  gap:8px;
}

.reel{
  width:88px;
  height:104px;

  display:flex;
  justify-content:center;
  align-items:center;

  border:2px solid #f0dce2;
  border-radius:17px;
  background:#fff;

  font-size:45px;

  box-shadow:
    inset 0 3px 8px rgba(143,98,111,.08),
    0 4px 8px rgba(164,111,128,.08);
}

.start-button{
  width:100%;
  margin-top:25px;
  padding:17px 12px;

  border:none;
  border-radius:18px;

  background:linear-gradient(180deg,#ffabc1,#f481a2);
  color:#fff;

  font-family:"Mochiy Pop One",sans-serif;
  font-size:19px;
  letter-spacing:.04em;

  cursor:pointer;

  box-shadow:
    0 6px 0 #d96587,
    0 10px 18px rgba(225,102,137,.19);

  animation:buttonGlow 2s ease-in-out infinite;
}

.start-button:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #d96587;
}

.start-button:disabled{
  cursor:default;
}

  @keyframes buttonGlow{

  0%,100%{
    box-shadow:
      0 6px 0 #d96587,
      0 0 12px rgba(255,120,170,.35),
      0 10px 18px rgba(225,102,137,.19);
  }

  50%{
    transform:scale(1.03);

    box-shadow:
      0 6px 0 #d96587,
      0 0 28px rgba(255,140,190,.8),
      0 10px 18px rgba(225,102,137,.35);
  }

}

#result{
  min-height:96px;
  margin-top:24px;

  color:#9a858c;
  font-family:"Mochiy Pop One",sans-serif;
  font-size:26px;
  line-height:1.5;
}

.result-small{
  display:block;
  margin-top:8px;

  color:#7f6d74;
  font-family:"M PLUS Rounded 1c",sans-serif;
  font-size:15px;
  font-weight:800;
}

.footer-message{
  margin-top:22px;

  color:#a58b94;
  font-size:12px;
  line-height:1.8;
}

.shake{
  animation:shake .09s infinite;
}

.pop{
  animation:pop .6s ease;
}

  reel.stop{
  animation:stopPop .28s ease;
}
  
  @keyframes stopPop{
  0%{
    transform:scale(1.25) rotate(-5deg);
  }

  60%{
    transform:scale(.9) rotate(3deg);
  }

  100%{
    transform:scale(1) rotate(0);
  }
}
  
@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(-4deg);
  }
  50%{
    transform:translateY(-9px) rotate(5deg);
  }
}

@keyframes shake{
  0%{transform:translateX(-2px)}
  50%{transform:translateX(2px)}
  100%{transform:translateX(-2px)}
}

@keyframes pop{
  0%{
    opacity:0;
    transform:scale(.75);
  }
  70%{
    transform:scale(1.08);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}
</style>
</head>

<body>

<div class="background-decoration">
  <span>🎀</span>
  <span>♡</span>
  <span>✨</span>
  <span>☁️</span>
  <span>☕</span>
  <span>🌸</span>
  <span>💗</span>
  <span>⭐</span>
</div>

<main class="card">

  <div class="top-label">
    SPECIAL BIRTHDAY LOTTERY
  </div>

  <div class="happy-birthday">
    🎂 Happy Birthday POCHIO 🎂
  </div>

  <h1>健太君くじ</h1>

  <div class="subtitle">
    ♡ ダブルアップチャンス ♡
  </div>

  <div class="message">
    最後までドキドキしてね…💗
  </div>

  <div class="slot-machine" id="slotMachine">

    <div class="slot-header">
  ✨ GOOD LUCK ✨
</div>

    <div class="slot-light">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="reels">
      <div class="reel" id="r1">🎀</div>
      <div class="reel" id="r2">🎂</div>
      <div class="reel" id="r3">🎁</div>
    </div>

  </div>

  <button
    class="start-button"
    id="startButton"
    onclick="startSlot()"
  >
    💗 START 💗
  </button>

  <div id="result"></div>

  <div class="footer-message">
    ぽちおにとって<br>
    素敵な一年になりますように…♡
  </div>

</main>

<script>
let running = false;

const messages = [
  {
    title:"🥺 今回は残念...",
    text:"ダブルアップならずでした💦"
  },
  {
    title:"☕ おしい！",
    text:"コーヒーがあと一歩だったね！"
  },
  {
    title:"🎀 残念！",
    text:"プレゼントが逃げていく～！！！"
  },
  {
    title:"⭐ 惜しい！",
    text:"運は次の一枚に温存中！"
  },
  {
    title:"🧸 ハズレ！",
    text:"くまさんが先に当たりを持っていった！"
  }
];
const patterns = [
  ["💰","💰","💛"],
  ["☕","☕","💔"],
  ["☕","🎁","💔"],
  ["⭐","☕","💔"],
  ["🧸","🧸","💔"],
  ["🍓","🍰","🧸"]
];
function startSlot(){

  if(running) return;
  running = true;

  const icons = [
    "🎂",
    "🎁",
    "☕",
    "🍓",
    "🎀",
    "🧸",
    "⭐",
    "💗"
  ];

  const reels = [
    document.getElementById("r1"),
    document.getElementById("r2"),
    document.getElementById("r3")
  ];

  const button =
    document.getElementById("startButton");

  const result =
    document.getElementById("result");

  const slotMachine =
    document.getElementById("slotMachine");
const selected =
  messages[Math.floor(Math.random() * messages.length)];

  const pattern =
  patterns[Math.floor(Math.random() * patterns.length)];
  
  button.disabled = true;
  button.textContent = "くるくる抽選チュ…♡";

  result.innerHTML = "";

  slotMachine.classList.add("shake");

  const timers = reels.map((reel) => {
    return setInterval(() => {
      const randomIndex =
        Math.floor(Math.random() * icons.length);

      reel.textContent = icons[randomIndex];
    },90);
  });

  setTimeout(() => {
    clearInterval(timers[0]);
    reels[0].textContent = pattern[0];
    reels[0].classList.add("stop");
  },1600);

  setTimeout(() => {
    clearInterval(timers[1]);
    reels[1].textContent = pattern[1];
    reels[1].classList.add("stop");
  },2200);

  setTimeout(() => {

    clearInterval(timers[2]);
    reels[2].textContent = pattern[2];
    reels[2].classList.add("stop");

    slotMachine.classList.remove("shake");

    result.classList.add("pop");

    result.innerHTML =
  selected.title +
  "<span class='result-small'>" +
  selected.text +
  "<br>でも、お誕生日おめでとう♡" +
  "</span>";

    button.textContent = "🎀 また挑戦してね 🎀";

    if(navigator.vibrate){
      navigator.vibrate([120,80,120]);
    }

  },2900);
}
</script>

</body>
</html>
