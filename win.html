<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>健太君くじ｜ダブルアップチャンス</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Mochiy+Pop+One&display=swap"
  rel="stylesheet"
>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px 14px;
  overflow-x:hidden;

  font-family:"M PLUS Rounded 1c",sans-serif;
  color:#66555c;

  background:
    radial-gradient(circle at 10% 12%, #ffe9f1 0 8%, transparent 9%),
    radial-gradient(circle at 92% 20%, #e7f6ff 0 9%, transparent 10%),
    radial-gradient(circle at 14% 88%, #fff1bf 0 8%, transparent 9%),
    linear-gradient(145deg,#fffdfd,#fff5f8 48%,#f2faff);
}

.background-decoration{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.background-decoration span{
  position:absolute;
  opacity:.35;
  animation:float 5s ease-in-out infinite;
}

.background-decoration span:nth-child(1){
  top:7%;
  left:7%;
  font-size:25px;
}

.background-decoration span:nth-child(2){
  top:13%;
  right:8%;
  font-size:28px;
  animation-delay:.8s;
}

.background-decoration span:nth-child(3){
  bottom:10%;
  left:8%;
  font-size:25px;
  animation-delay:1.4s;
}

.background-decoration span:nth-child(4){
  bottom:8%;
  right:7%;
  font-size:28px;
  animation-delay:2s;
}

.card{
  position:relative;
  z-index:2;

  width:100%;
  max-width:420px;
  padding:32px 24px 28px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.62),
      rgba(255,255,255,.30)
    );

  border:1px solid rgba(255,255,255,.82);
  border-radius:34px;

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  box-shadow:
    0 24px 60px rgba(154,117,133,.14),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(255,255,255,.35);

  overflow:hidden;
}

  .card::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      120deg,
      transparent 20%,
      rgba(255,255,255,.35) 45%,
      transparent 70%
    );

  transform:translateX(-120%);
  animation:cardShine 7s ease-in-out infinite;
  pointer-events:none;
}

.card > *{
  position:relative;
  z-index:1;
}

@keyframes cardShine{
  0%,75%{
    transform:translateX(-120%);
  }

  100%{
    transform:translateX(120%);
  }
}

.top-label{
  display:inline-block;
  padding:7px 15px;
  margin-bottom:11px;

  border-radius:999px;
  background:#e8f7ff;
  color:#68a7c5;

  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
}

.happy-birthday{
  margin-bottom:5px;

  color:#df839e;
  font-family:"Mochiy Pop One",sans-serif;
  font-size:15px;
  letter-spacing:.04em;
}

h1{
  margin:0;

  font-family:"Mochiy Pop One",sans-serif;
  font-size:34px;
  color:#ef789a;

  text-shadow:
    2px 2px 0 #fff,
    4px 4px 0 #ffe3eb;
}

.subtitle{
  display:inline-block;
  margin-top:12px;
  padding:7px 16px;

  border-radius:999px;
  background:#fff1c9;
  color:#b58a38;

  font-size:15px;
  font-weight:800;
}

.message{
  margin-top:14px;
  font-size:13px;
  color:#9a858c;
}

.slot-machine{
  position:relative;
  margin-top:23px;
  padding:18px 14px 20px;

  border:1px solid rgba(255,255,255,.75);
  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.72),
      rgba(255,255,255,.38)
    );

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  box-shadow:
    0 4px 0 rgba(232,158,181,.38),
    0 16px 34px rgba(193,129,154,.14),
    inset 0 1px 0 rgba(255,255,255,.95),
    0 0 24px rgba(255,188,215,.18);

  overflow:hidden;
}

  .slot-machine::before{
  content:"";
  position:absolute;
  top:0;
  left:-130%;
  width:80%;
  height:100%;

  background:
    linear-gradient(
      120deg,
      transparent,
      rgba(255,255,255,.55),
      transparent
    );

  animation:glassShine 5s ease-in-out infinite;
  pointer-events:none;
  z-index:0;
}

.slot-machine > *{
  position:relative;
  z-index:1;
}
  

@keyframes glassShine{
  0%,70%{
    left:-130%;
  }

  100%{
    left:150%;
  }
}

  .slot-header{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:16px;

  font-family:"M PLUS Rounded 1c",sans-serif;
  font-size:15px;
  font-weight:700;
  letter-spacing:.18em;

  color:#e18aa5;
  text-shadow:0 1px 8px rgba(255,255,255,.9);
}

.slot-header span{
  width:42px;
  height:1px;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(225,138,165,.8),
    transparent
  );
}

.slot-light{
  display:flex;
  justify-content:center;
  gap:9px;
  margin-bottom:11px;
}

.slot-light span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff8a9;
  box-shadow:0 0 8px #ffd45c;
}

.reels{
  display:flex;
  justify-content:center;
  gap:8px;
}

.reel{
  width:88px;
  height:104px;

  display:flex;
  justify-content:center;
  align-items:center;

  border:1px solid rgba(255,255,255,.85);
  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.72),
      rgba(255,255,255,.38)
    );

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  font-size:50px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    0 10px 22px rgba(210,145,170,.10),
    0 0 24px rgba(255,220,230,.18);
}

.start-button{
  width:100%;
  margin-top:25px;
  padding:17px 12px;

  border:none;
  border-radius:18px;

  background:linear-gradient(180deg,#ffabc1,#f481a2);
  color:#fff;

  font-family:"Mochiy Pop One",sans-serif;
  font-size:19px;
  letter-spacing:.04em;

  cursor:pointer;

  box-shadow:
    0 6px 0 #d96587,
    0 10px 18px rgba(225,102,137,.19);
}

.start-button:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #d96587;
}

.start-button:disabled{
  cursor:default;
}

#result{
  min-height:96px;
  margin-top:24px;

  color:#ed718f;
  font-family:"Mochiy Pop One",sans-serif;
  font-size:26px;
  line-height:1.5;
}

.result-small{
  display:block;
  margin-top:8px;

  color:#7f6d74;
  font-family:"M PLUS Rounded 1c",sans-serif;
  font-size:15px;
  font-weight:800;
}

.gift-button{
  display:none;
  width:100%;
  margin-top:5px;
  padding:16px;

  border-radius:18px;
  background:linear-gradient(180deg,#9bddcf,#72c5b3);
  color:#fff;

  text-decoration:none;
  font-family:"Mochiy Pop One",sans-serif;
  font-size:17px;

  box-shadow:
    0 6px 0 #51a896,
    0 10px 18px rgba(81,168,150,.15);
}

.gift-button:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #51a896;
}

.notice{
  display:none;
  margin-top:12px;

  color:#a08c93;
  font-size:11px;
  line-height:1.6;
}

.footer-message{
  margin-top:22px;

  color:#a58b94;
  font-size:12px;
  line-height:1.8;
}

.shake{
  animation:shake .09s infinite;
}

.win-glow{
  animation:winGlow .7s alternate infinite;
}

.pop{
  animation:pop .6s ease;
}

.confetti{
  position:fixed;
  top:-30px;
  z-index:10;

  font-size:22px;
  pointer-events:none;

  animation:fall 3.5s linear forwards;
}

@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(-4deg);
  }
  50%{
    transform:translateY(-9px) rotate(5deg);
  }
}

@keyframes shake{
  0%{transform:translateX(-2px)}
  50%{transform:translateX(2px)}
  100%{transform:translateX(-2px)}
}

@keyframes winGlow{
  from{
    box-shadow:
      0 4px 0 rgba(232,158,181,.38),
      0 16px 34px rgba(193,129,154,.14),
      inset 0 1px 0 rgba(255,255,255,.95),
      0 0 12px rgba(255,188,215,.25);
  }

  to{
    box-shadow:
      0 4px 0 rgba(232,158,181,.30),
      0 18px 38px rgba(193,129,154,.16),
      inset 0 1px 0 rgba(255,255,255,.95),
      0 0 34px rgba(255,170,205,.65);
  }
}

@keyframes pop{
  0%{
    opacity:0;
    transform:scale(.75);
  }
  70%{
    transform:scale(1.08);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes fall{
  0%{
    transform:translateY(-30px) rotate(0deg);
    opacity:1;
  }
  100%{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="background-decoration">
  <span>🎀</span>
  <span>♡</span>
  <span>✨</span>
  <span>☁️</span>
</div>

<main class="card">

  <div class="top-label">
    SPECIAL BIRTHDAY LOTTERY
  </div>

  <div class="happy-birthday">
    🎂 Happy Birthday POCHIO 🎂
  </div>

  <h1>健太君くじ</h1>

  <div class="subtitle">
    ♡ ダブルアップチャンス ♡
  </div>

  <div class="message">
    最後までドキドキしてね…💗
  </div>

  <div class="slot-machine" id="slotMachine">

    <div class="slot-header">
  <span></span>
  GOOD LUCK
  <span></span>
</div>

    

    <div class="slot-light">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="reels">
      <div class="reel" id="r1">🎀</div>
      <div class="reel" id="r2">🎂</div>
      <div class="reel" id="r3">🎁</div>
    </div>

  </div>

  <button
    class="start-button"
    id="startButton"
    onclick="startSlot()"
  >
    💗 START 💗
  </button>

  <div id="result"></div>

  <a
    class="gift-button"
    id="giftButton"
    href="https://gift.starbucks.co.jp/c/1785QAuXeXb0Wy5Cb1Y4aRelQHpzZ2ER?from=order-email/"
    target="_blank"
    rel="noopener noreferrer"
  >
    🎁 プレゼントを見る
  </a>

  <div class="notice" id="notice">
  ※ボタンを押すとスターバックスのギフトページが開きます。
</div>

  <div class="footer-message">
    ぽちおにとって<br>
    素敵な一年になりますように…♡
  </div>

</main>

<script>
let running = false;

function startSlot(){

  if(running) return;
  running = true;

  const icons = [
    "🎂",
    "🎁",
    "☕",
    "🍓",
    "🎀",
    "🧸",
    "⭐",
    "💗"
  ];

  const reels = [
    document.getElementById("r1"),
    document.getElementById("r2"),
    document.getElementById("r3")
  ];

  const button =
    document.getElementById("startButton");

  const result =
    document.getElementById("result");

  const slotMachine =
    document.getElementById("slotMachine");

  const giftButton =
    document.getElementById("giftButton");

  const notice =
    document.getElementById("notice");

  button.disabled = true;
  button.textContent = "くるくる抽選チュ…♡";

  result.innerHTML = "";

  slotMachine.classList.add("shake");

  const timers = reels.map((reel) => {
    return setInterval(() => {
      const randomIndex =
        Math.floor(Math.random() * icons.length);

      reel.textContent = icons[randomIndex];
    },90);
  });

  setTimeout(() => {
  clearInterval(timers[0]);
  reels[0].textContent = "☕";
  reels[0].classList.add("stop");
},1600);

  setTimeout(() => {
  clearInterval(timers[1]);
  reels[1].textContent = "☕";
  reels[1].classList.add("stop");
},2200);

setTimeout(() => {

  clearInterval(timers[2]);
  reels[2].textContent = "☕";
  reels[2].classList.add("stop");

  slotMachine.classList.remove("shake");
  slotMachine.classList.add("win-glow");

  result.classList.add("pop");

  result.innerHTML =
    "🎉 おめでとう 🎉" +
    "<span class='result-small'>" +
    "ぽちお~❕、大当たり〜❕💗<br>" +
    "コーヒーをプレゼント☕" +
    "</span>";

  giftButton.style.display = "block";
  notice.style.display = "block";

  button.textContent = "🎀 大当たり 🎀";

  createConfetti();

  if(navigator.vibrate){
    navigator.vibrate([150,80,150,80,350]);
  }

},2900);
}

function createConfetti(){

  const decorations = [
    "💗",
    "💓",
    "💖",
    "💙",
    "💚",
    "💜"
  ];

  for(let i = 0; i < 32; i++){

    const confetti =
      document.createElement("div");

    confetti.className = "confetti";

    confetti.textContent =
      decorations[
        Math.floor(
          Math.random() * decorations.length
        )
      ];

    confetti.style.left =
      Math.random() * 100 + "vw";

    confetti.style.animationDelay =
      Math.random() * 1.3 + "s";

    confetti.style.animationDuration =
      2.5 + Math.random() * 2 + "s";

    document.body.appendChild(confetti);

    setTimeout(() => {
      confetti.remove();
    },5000);
  }
}
</script>

</body>
</html>
